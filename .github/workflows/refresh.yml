# Regenerates rounds.json from the outlets' feeds, adds the run to the monthly archive, asks an AI
# model about framing in new rounds (when the secret is set), and commits what changed. GitHub
# Pages serves the repository root, so each commit publishes a new edition.
name: Refresh stories

on:
  schedule:
    - cron: "17 * * * *"   # hourly: GitHub skips scheduled runs at times, so a skip costs an hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stories

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and group stories
        run: python3 fetch_news.py
      - name: Analyse framing with AI
        # Optional. Does nothing unless the OPENCODE_API_KEY secret is set. A failure here must not
        # stop the stories from being committed, so the step may fail without failing the job.
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: python3 analyze_bias.py --limit 6
      - name: Commit rounds, archive and analysis
        run: |
          mkdir -p archive analysis
          git add -A -- rounds.json archive analysis
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh stories"
          git push
