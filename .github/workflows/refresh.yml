# Regenerates rounds.json from the outlets' feeds, adds the run to the monthly archive, asks an AI
# model about framing in new rounds (when the secret is set), and commits what changed. GitHub
# Pages serves the repository root, so each commit publishes a new edition.
name: Refresh stories

on:
  schedule:
    - cron: "17 * * * *"   # hourly: GitHub drops most scheduled runs (about one in six fired), so ask often
  workflow_dispatch:
    inputs:
      analysis_limit:
        description: "Most archived rounds to analyse in this run (scheduled runs use 40)"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: refresh-stories

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and group stories
        run: python3 fetch_news.py
      - name: Analyse framing with AI
        # Optional. Does nothing unless the OPENCODE_API_KEY secret is set. A failure here must not
        # stop the stories from being committed, so the step may fail without failing the job.
        continue-on-error: true
        env:
          LIMIT: ${{ inputs.analysis_limit || 40 }}
          ANALYSIS_PROVIDER: ${{ vars.ANALYSIS_PROVIDER }}  # "opencode" (default) or "anthropic"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}  # optional: low, medium, high, xhigh, max
        run: python3 analyze_bias.py --limit "$LIMIT"
      - name: Commit rounds, archive and analysis
        run: |
          mkdir -p archive analysis
          git add -A -- rounds.json archive analysis
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh stories"
          # Another commit may have landed while this ran; put ours on top rather than lose the run.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
